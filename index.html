<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#07111f">

  <title>Live Football</title>

  <style>
    :root {
      --background: #07111f;
      --panel: #101d2e;
      --panel-light: #17283d;
      --text: #f5f7fb;
      --muted: #9eb0c6;
      --accent: #54e38e;
      --border: rgba(255, 255, 255, 0.09);
      --error: #ff8b9d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at top right,
          rgba(45, 120, 255, 0.2),
          transparent 30rem
        ),
        var(--background);
    }

    header,
    main {
      width: min(1100px, calc(100% - 28px));
      margin: 0 auto;
    }

    header {
      padding: 34px 0 20px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.5rem);
      letter-spacing: -0.05em;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin: 22px 0;
    }

    button {
      padding: 11px 15px;

      font: inherit;
      font-weight: 700;

      color: var(--text);
      background: var(--panel);

      border: 1px solid var(--border);
      border-radius: 12px;

      cursor: pointer;
    }

    button:hover {
      background: var(--panel-light);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .status {
      margin-left: auto;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .section-heading {
      display: flex;
      align-items: center;
      gap: 10px;

      margin: 28px 0 12px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 1.3rem;
    }

    .counter {
      min-width: 29px;
      padding: 4px 8px;

      font-size: 0.8rem;
      text-align: center;

      color: var(--muted);
      background: var(--panel-light);

      border-radius: 999px;
    }

    .live-counter {
      color: var(--accent);
    }

    .league {
      margin-bottom: 13px;

      background: rgba(16, 29, 46, 0.9);

      border: 1px solid var(--border);
      border-radius: 16px;

      overflow: hidden;
    }

    .league-button {
      display: flex;
      align-items: center;
      gap: 12px;

      width: 100%;
      padding: 15px;

      text-align: left;

      background: transparent;
      border: 0;
      border-radius: 0;
    }

    .league-logo {
      width: 36px;
      height: 36px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .league-info {
      min-width: 0;
    }

    .league-name {
      display: block;
      font-weight: 800;
    }

    .league-country {
      display: block;
      margin-top: 2px;

      color: var(--muted);
      font-size: 0.82rem;
    }

    .league-count {
      margin-left: auto;
      color: var(--muted);
      white-space: nowrap;
    }

    .arrow {
      font-size: 1.1rem;
      transition: transform 0.2s ease;
    }

    .league.open .arrow {
      transform: rotate(180deg);
    }

    .games {
      display: none;
      border-top: 1px solid var(--border);
    }

    .league.open .games {
      display: block;
    }

    .game {
      display: grid;
      grid-template-columns: minmax(105px, 145px) 1fr auto;
      gap: 15px;
      align-items: start;

      padding: 16px;

      border-bottom: 1px solid var(--border);
    }

    .game:last-child {
      border-bottom: 0;
    }

    .game-time {
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.45;
    }

    .live-text {
      color: var(--accent);
    }

    .game-content {
      display: grid;
      gap: 13px;
      min-width: 0;
    }

    .teams {
      display: grid;
      gap: 9px;
    }

    .team {
      display: flex;
      align-items: center;
      gap: 9px;

      min-width: 0;

      font-weight: 700;
    }

    .team img {
      width: 25px;
      height: 25px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .team span {
      overflow-wrap: anywhere;
    }

    .score {
      min-width: 55px;

      font-size: 1.15rem;
      font-weight: 900;
      line-height: 1.8;
      text-align: right;
    }

    .watch-box {
      display: grid;
      gap: 7px;

      padding: 11px 12px;

      background: rgba(255, 255, 255, 0.045);

      border: 1px solid var(--border);
      border-radius: 11px;
    }

    .watch-main {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;

      font-size: 0.85rem;
    }

    .watch-label {
      color: var(--muted);
    }

    .watch-service {
      color: var(--accent);
      font-weight: 800;
    }

    .watch-channels {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;

      color: var(--muted);
      font-size: 0.78rem;
    }

    .watch-badge {
      display: inline-flex;
      padding: 3px 7px;

      color: var(--text);
      background: var(--panel-light);

      border-radius: 999px;
    }

    .watch-note {
      color: var(--muted);
      font-size: 0.72rem;
    }

    .message {
      padding: 22px;

      color: var(--muted);
      text-align: center;

      border: 1px dashed var(--border);
      border-radius: 16px;
    }

    .error-message {
      color: var(--error);
      border-color: rgba(255, 139, 157, 0.4);
    }

    footer {
      padding: 38px 14px;

      color: var(--muted);
      text-align: center;
      font-size: 0.8rem;
    }

    @media (max-width: 680px) {
      .status {
        width: 100%;
        margin-left: 0;
      }

      .game {
        grid-template-columns: 1fr auto;
      }

      .game-time {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Live Football</h1>

    <p class="subtitle">
      Live games and upcoming games for today and tomorrow.
    </p>

    <div class="toolbar">
      <button id="refreshButton" type="button">
        ↻ Refresh games
      </button>

      <span id="status" class="status">
        Loading games...
      </span>
    </div>
  </header>

  <main>
    <div class="section-heading">
      <h2>Live now</h2>

      <span id="liveCount" class="counter live-counter">
        0
      </span>
    </div>

    <section id="liveLeagues">
      <div class="message">Loading live games...</div>
    </section>

    <div class="section-heading">
      <h2>Upcoming</h2>

      <span id="upcomingCount" class="counter">
        0
      </span>
    </div>

    <section id="upcomingLeagues">
      <div class="message">Loading upcoming games...</div>
    </section>
  </main>

  <footer>
    Scores and schedules provided by API-Football.
    Viewing options are general U.S. broadcast-rights information.
  </footer>

  <script>
    const liveContainer =
      document.getElementById("liveLeagues");

    const upcomingContainer =
      document.getElementById("upcomingLeagues");

    const liveCount =
      document.getElementById("liveCount");

    const upcomingCount =
      document.getElementById("upcomingCount");

    const statusText =
      document.getElementById("status");

    const refreshButton =
      document.getElementById("refreshButton");


    /*
      GENERAL U.S. VIEWING OPTIONS

      These are league-level broadcast rights.
      They do not guarantee the exact channel for every game.
    */

    const tvOptions = [
      {
        keywords: [
          "uefa champions league",
          "champions league"
        ],
        service: "Paramount+",
        channels: [
          "CBS",
          "CBS Sports Network",
          "CBS Sports Golazo Network"
        ]
      },
      {
        keywords: [
          "uefa europa league",
          "europa league"
        ],
        service: "Paramount+",
        channels: [
          "CBS Sports Network",
          "CBS Sports Golazo Network"
        ]
      },
      {
        keywords: [
          "uefa conference league",
          "conference league"
        ],
        service: "Paramount+",
        channels: [
          "CBS Sports Golazo Network"
        ]
      },
      {
        keywords: [
          "premier league"
        ],
        service: "Peacock",
        channels: [
          "NBC",
          "USA Network",
          "Telemundo",
          "Universo"
        ]
      },
      {
        keywords: [
          "laliga",
          "la liga"
        ],
        service: "ESPN+",
        channels: [
          "ESPN",
          "ESPN2",
          "ESPN Deportes"
        ]
      },
      {
        keywords: [
          "bundesliga"
        ],
        service: "ESPN+",
        channels: [
          "ESPN",
          "ESPN2",
          "ABC",
          "ESPN Deportes"
        ]
      },
      {
        keywords: [
          "serie a"
        ],
        service: "Paramount+",
        channels: [
          "CBS Sports Network",
          "CBS Sports Golazo Network"
        ]
      },
      {
        keywords: [
          "ligue 1"
        ],
        service: "beIN SPORTS",
        channels: [
          "beIN SPORTS en Español"
        ]
      },
      {
        keywords: [
          "major league soccer",
          "mls"
        ],
        service: "Apple TV",
        channels: [
          "FOX",
          "FS1",
          "FOX Deportes"
        ]
      },
      {
        keywords: [
          "liga mx"
        ],
        service: "ViX",
        channels: [
          "Univision",
          "TUDN",
          "FOX Deportes",
          "Telemundo"
        ]
      },
      {
        keywords: [
          "fa cup"
        ],
        service: "ESPN+",
        channels: []
      },
      {
        keywords: [
          "efl championship",
          "championship",
          "carabao cup",
          "efl cup"
        ],
        service: "Paramount+",
        channels: [
          "CBS Sports Network",
          "CBS Sports Golazo Network"
        ]
      },
      {
        keywords: [
          "nwsl"
        ],
        service: "NWSL+",
        channels: [
          "CBS",
          "Paramount+",
          "ESPN+",
          "ION"
        ]
      },
      {
        keywords: [
          "usl championship",
          "usl league one"
        ],
        service: "CBS Sports Golazo Network",
        channels: [
          "CBS Sports Network",
          "ESPN+"
        ]
      }
    ];


    function escapeHtml(value = "") {
      return String(value).replace(
        /[&<>"']/g,
        character => {
          const replacements = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            "\"": "&quot;",
            "'": "&#039;"
          };

          return replacements[character];
        }
      );
    }


    function getWatchOptions(leagueName = "") {
      const normalizedLeague =
        leagueName.toLowerCase();

      const matchingOption =
        tvOptions.find(option =>
          option.keywords.some(keyword =>
            normalizedLeague.includes(keyword)
          )
        );

      return matchingOption || {
        service: "Check local listings",
        channels: []
      };
    }


    function createWatchMarkup(leagueName) {
      const watch =
        getWatchOptions(leagueName);

      const channelMarkup =
        watch.channels.length > 0
          ? `
            <div class="watch-channels">
              <span>Possible channels:</span>

              ${watch.channels
                .map(channel => `
                  <span class="watch-badge">
                    ${escapeHtml(channel)}
                  </span>
                `)
                .join("")}
            </div>
          `
          : "";

      return `
        <div class="watch-box">
          <div class="watch-main">
            <span class="watch-label">
              How to watch:
            </span>

            <span class="watch-service">
              ${escapeHtml(watch.service)}
            </span>
          </div>

          ${channelMarkup}

          <div class="watch-note">
            Exact channel can vary by game and location.
          </div>
        </div>
      `;
    }


    function groupMatchesByLeague(matches) {
      return matches.reduce(
        (groups, match) => {
          const leagueId =
            String(match.league.id);

          if (!groups[leagueId]) {
            groups[leagueId] = {
              league: match.league,
              matches: []
            };
          }

          groups[leagueId].matches.push(match);

          return groups;
        },
        {}
      );
    }


    function formatKickoff(dateString) {
      const kickoff =
        new Date(dateString);

      return {
        date: new Intl.DateTimeFormat(
          "en-US",
          {
            weekday: "short",
            month: "short",
            day: "numeric",
            timeZone: "America/Chicago"
          }
        ).format(kickoff),

        time: new Intl.DateTimeFormat(
          "en-US",
          {
            hour: "numeric",
            minute: "2-digit",
            timeZone: "America/Chicago"
          }
        ).format(kickoff)
      };
    }


    function createGameMarkup(match, isLive) {
      const kickoff =
        formatKickoff(match.fixture.date);

      const status =
        match.fixture.status || {};

      const homeGoals =
        match.goals?.home ?? "–";

      const awayGoals =
        match.goals?.away ?? "–";

      const elapsed =
        status.elapsed
          ? `${status.elapsed}'`
          : "";

      const liveStatus =
        `${elapsed} ${status.short || "LIVE"}`.trim();

      const scoreMarkup =
        isLive
          ? `${homeGoals}<br>${awayGoals}`
          : "vs";

      return `
        <article class="game">
          <div class="game-time ${isLive ? "live-text" : ""}">
            <strong>
              ${isLive
                ? escapeHtml(liveStatus)
                : escapeHtml(kickoff.date)}
            </strong>

            <br>

            ${isLive
              ? "LIVE"
              : `${escapeHtml(kickoff.time)} CT`}
          </div>

          <div class="game-content">
            <div class="teams">
              <div class="team">
                <img
                  src="${escapeHtml(match.teams.home.logo)}"
                  alt=""
                >

                <span>
                  ${escapeHtml(match.teams.home.name)}
                </span>
              </div>

              <div class="team">
                <img
                  src="${escapeHtml(match.teams.away.logo)}"
                  alt=""
                >

                <span>
                  ${escapeHtml(match.teams.away.name)}
                </span>
              </div>
            </div>

            ${createWatchMarkup(match.league.name)}
          </div>

          <div class="score">
            ${scoreMarkup}
          </div>
        </article>
      `;
    }


    function createLeagueMarkup(group, isLive) {
      const league =
        group.league;

      const matches =
        group.matches;

      return `
        <article class="league">
          <button
            class="league-button"
            type="button"
            aria-expanded="false"
          >
            <img
              class="league-logo"
              src="${escapeHtml(league.logo)}"
              alt=""
            >

            <span class="league-info">
              <span class="league-name">
                ${escapeHtml(league.name)}
              </span>

              <span class="league-country">
                ${escapeHtml(league.country || "")}
              </span>
            </span>

            <span class="league-count">
              ${matches.length}
              ${matches.length === 1 ? "game" : "games"}
            </span>

            <span class="arrow">
              ⌄
            </span>
          </button>

          <div class="games">
            ${matches
              .map(match =>
                createGameMarkup(match, isLive)
              )
              .join("")}
          </div>
        </article>
      `;
    }


    function addLeagueClickEvents(container) {
      const buttons =
        container.querySelectorAll(
          ".league-button"
        );

      buttons.forEach(button => {
        button.addEventListener(
          "click",
          () => {
            const league =
              button.closest(".league");

            const isOpen =
              league.classList.toggle("open");

            button.setAttribute(
              "aria-expanded",
              String(isOpen)
            );
          }
        );
      });
    }


    function renderMatches(
      container,
      matches,
      isLive
    ) {
      if (!Array.isArray(matches)) {
        container.innerHTML = `
          <div class="message error-message">
            Match data was not formatted correctly.
          </div>
        `;

        return;
      }

      if (matches.length === 0) {
        container.innerHTML = `
          <div class="message">
            No ${isLive ? "live" : "upcoming"} games found.
          </div>
        `;

        return;
      }

      const groupedMatches =
        Object.values(
          groupMatchesByLeague(matches)
        ).sort(
          (firstGroup, secondGroup) =>
            firstGroup.league.name.localeCompare(
              secondGroup.league.name
            )
        );

      container.innerHTML =
        groupedMatches
          .map(group =>
            createLeagueMarkup(group, isLive)
          )
          .join("");

      addLeagueClickEvents(container);
    }


    async function readJsonResponse(response) {
      const responseText =
        await response.text();

      try {
        return JSON.parse(responseText);
      } catch {
        throw new Error(
          responseText ||
          "The server returned an invalid response."
        );
      }
    }


    async function loadMatches() {
      statusText.textContent =
        "Loading games...";

      refreshButton.disabled = true;

      try {
        const response =
          await fetch(
            `/api/fixtures?days=1&t=${Date.now()}`,
            {
              cache: "no-store"
            }
          );

        const data =
          await readJsonResponse(response);

        if (!response.ok) {
          throw new Error(
            data.details ||
            data.error ||
            "Could not load games."
          );
        }

        const liveMatches =
          Array.isArray(data.live)
            ? data.live
            : [];

        const upcomingMatches =
          Array.isArray(data.upcoming)
            ? data.upcoming
            : [];

        liveCount.textContent =
          String(liveMatches.length);

        upcomingCount.textContent =
          String(upcomingMatches.length);

        renderMatches(
          liveContainer,
          liveMatches,
          true
        );

        renderMatches(
          upcomingContainer,
          upcomingMatches,
          false
        );

        const updatedAt =
          data.updatedAt
            ? new Date(data.updatedAt)
            : new Date();

        statusText.textContent =
          `Updated ${updatedAt.toLocaleTimeString(
            [],
            {
              hour: "numeric",
              minute: "2-digit"
            }
          )}`;
      } catch (error) {
        console.error(error);

        liveCount.textContent = "0";
        upcomingCount.textContent = "0";

        const errorMessage =
          escapeHtml(
            error.message ||
            "Could not load games."
          );

        liveContainer.innerHTML = `
          <div class="message error-message">
            ${errorMessage}
          </div>
        `;

        upcomingContainer.innerHTML = `
          <div class="message error-message">
            ${errorMessage}
          </div>
        `;

        statusText.textContent =
          "Could not load games";
      } finally {
        refreshButton.disabled = false;
      }
    }


    refreshButton.addEventListener(
      "click",
      loadMatches
    );


    loadMatches();


    /*
      Refresh every five minutes.

      Your Vercel API uses caching, which helps avoid
      wasting too many API-Football requests.
    */

    setInterval(
      loadMatches,
      5 * 60 * 1000
    );
  </script>
</body>
</html>
